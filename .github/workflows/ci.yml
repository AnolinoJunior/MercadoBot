name: CI do MercadoBot
on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar o .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Compilar a API
        run: dotnet build MercadoBot.Api/MercadoBot.Api.csproj --configuration Release

      - name: Preparar arquivos para publicação
        run: dotnet publish MercadoBot.Api/MercadoBot.Api.csproj --configuration Release --no-build --output ./publish -p:UseAppHost=false

      - name: Disponibilizar pacote no GitHub
        uses: actions/upload-artifact@v7
        with:
          name: MercadoBot
          path: ./publish/
          if-no-files-found: error